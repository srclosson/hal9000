# Host, TLS and DNS annotations are set per cluster in the overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hal9000
  namespace: hal9000
spec:
  rules:
    - host: HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hal9000
                port:
                  name: http
