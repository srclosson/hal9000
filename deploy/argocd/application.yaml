# Apply once the repo is in git: kubectl apply -n argocd -f deploy/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hal9000
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/hal9000.git
    targetRevision: main
    path: deploy/overlays/civo
  destination:
    server: https://kubernetes.default.svc
    namespace: hal9000
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
