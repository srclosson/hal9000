apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hal9000
  namespace: hal9000
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 9000.stackgen.run
      secretName: hal9000-tls
  rules:
    - host: 9000.stackgen.run
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hal9000
                port:
                  name: http
